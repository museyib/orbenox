services:
  main-db:
    image: postgres:17-alpine
    container_name: orbenox-db
    environment:
      POSTGRES_DB: orbenox
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"
    volumes:
      - main_data:/var/lib/postgresql/data

  stock-db:
    image: postgres:17-alpine
    container_name: stock-db
    environment:
      POSTGRES_DB: stock
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5436:5432"
    volumes:
      - stock_data:/var/lib/postgresql/data

  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  eureka-service:
    build:
      context: ./eureka-service
    environment:
      SERVER_PORT: ${EUREKA_SERVICE_PORT}
    ports:
      - "${EUREKA_SERVICE_PORT}:${EUREKA_SERVICE_PORT}"
    healthcheck:
      test: [ "CMD-SHELL", "wget -q --spider http://localhost:${EUREKA_SERVICE_PORT}/actuator/health" ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  api-gateway:
    build:
      context: ./api-gateway
    environment:
      SERVER_PORT: ${API_GATEWAY_PORT}
      EUREKA_DEFAULT_ZONE: ${EUREKA_DEFAULT_ZONE}
      EUREKA_PREFER_IP_ADDRESS: ${EUREKA_PREFER_IP_ADDRESS}
    ports:
      - "${API_GATEWAY_PORT}:${API_GATEWAY_PORT}"
    healthcheck:
      test: [ "CMD-SHELL", "wget -q --spider http://localhost:${API_GATEWAY_PORT}/actuator/health" ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    depends_on:
      eureka-service:
        condition: service_healthy
      web-api:
        condition: service_started

  web-api:
    build:
      context: .
      dockerfile: web-api/Dockerfile
    deploy:
      replicas: 3
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:postgresql://main-db:5432/orbenox
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      SPRING_DATA_REDIS_HOST: redis
      EUREKA_DEFAULT_ZONE: ${EUREKA_DEFAULT_ZONE}
      EUREKA_PREFER_IP_ADDRESS: ${EUREKA_PREFER_IP_ADDRESS}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      AUTH0_CLIENT_ID: ${AUTH0_CLIENT_ID}
      AUTH0_CLIENT_SECRET: ${AUTH0_CLIENT_SECRET}
      AUTH0_STOCK_SERVICE_AUDIENCE: ${AUTH0_STOCK_SERVICE_AUDIENCE}
    depends_on:
      eureka-service:
        condition: service_healthy
      main-db:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  rabbitmq:
    image: rabbitmq:management
    container_name: rabbitmq
    ports:
      - "5673:5672"
      - "15673:15672"
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  stock-service:
    build:
      context: .
      dockerfile: stock-service/Dockerfile
    environment:
      STOCK_DB_URL: jdbc:postgresql://stock-db:5432/stock
      STOCK_DB_USERNAME: postgres
      STOCK_DB_PASSWORD: postgres
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      EUREKA_DEFAULT_ZONE: ${EUREKA_DEFAULT_ZONE}
      EUREKA_PREFER_IP_ADDRESS: ${EUREKA_PREFER_IP_ADDRESS}
    depends_on:
      eureka-service:
        condition: service_healthy
      stock-db:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    environment:
      DB_URL: jdbc:postgresql://main-db:5432/orbenox
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
    depends_on:
      main-db:
        condition: service_started
      rabbitmq:
        condition: service_healthy

volumes:
  main_data:
  redis_data:
  stock_data:
