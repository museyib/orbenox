spring:
  jpa:
    show-sql: false
    properties:
      hibernate:
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
        generate_statistics: false
  flyway:
    baseline-on-migrate: false
  web:
    error:
      include-message: never
      include-stacktrace: never
      include-exception: false

springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false
